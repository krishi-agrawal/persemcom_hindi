# Stage 1 (channel codec, MSE) and Stage 2 (joint, CTC) of Algorithm 1 over AWGN.
init_from: checkpoints/asr/best.pt
model:
  channel: awgn
  codec_hidden: 256
  n_symbols: 32          # 32 complex symbols per encoder frame (B x n_sub x 32 x 2)
snr_db: {low: -10.0, high: 20.0}
stage1:
  lr: 1.0e-3
  max_epochs: 10
  ckpt_dir: checkpoints/awgn/stage1
stage2:
  lr: 1.0e-4
  max_epochs: 20
  select_snr_db: 10      # checkpoint selection on val WER at this SNR
  ckpt_dir: checkpoints/awgn/stage2
amp: true
