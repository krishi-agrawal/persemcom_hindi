[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persemcom"
version = "0.1.0"
description = "PerSemCom (personalized semantic communication for speech) reimplemented for Hindi"
requires-python = ">=3.10"
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "sentencepiece",
    "transformers>=4.44,<5",
    "sentence-transformers>=3,<4",
    "datasets",
    "jiwer",
    "librosa",
    "soundfile",
    "vocos",
    "scikit-learn",
    "fastdtw",
    "pyyaml",
    "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["persemcom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
